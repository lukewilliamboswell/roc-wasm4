name: CI
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    permissions:
      contents: read
    uses: ./.github/workflows/host.yml
  source:
    name: Current source
    needs: host
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@8afe656ea7de5586233683088eb6972b770f6832
      with:
        cache: true
        cache-workload: ci-source
    - uses: roc-lang/setup-roc@dd81390553b0a1236aedb61cdd4c0ed7cf7eaec4
      with:
        version: nightly
        nightly-tag: ''
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: wasm32-host
        path: platform/targets/wasm32
    - run: blueprint run check-source
    - run: blueprint run glue
      env:
        GH_TOKEN: ${{ github.token }}
  required:
    name: test-examples
    if: always()
    needs:
    - host
    - source
    runs-on: ubuntu-24.04
    steps:
    - env:
        HOST_RESULT: ${{ needs.host.result }}
        SOURCE_RESULT: ${{ needs.source.result }}
      run: test "$HOST_RESULT" = success && test "$SOURCE_RESULT" = success
