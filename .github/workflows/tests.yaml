name: Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: "Validate a nightly candidate without publishing or deploying"
        type: boolean
        required: false
        default: false

# this cancels workflows currently in progress if you start a new one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  current-source:
    name: Current source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler

      - name: Show installed Roc version
        run: roc version

      - run: ROC=roc ./ci/all_tests.sh

  published-examples:
    name: Published examples
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler

      - name: Show installed Roc version
        run: roc version
      - name: Check and build committed release URLs with a fresh cache
        run: ROC=roc python3 ci/examples.py published

  test-examples:
    name: test-examples
    if: always()
    needs: [current-source, published-examples]
    runs-on: ubuntu-latest
    steps:
      - name: Require both example validation lanes
        env:
          SOURCE_RESULT: ${{ needs.current-source.result }}
          PUBLISHED_RESULT: ${{ needs.published-examples.result }}
        run: test "$SOURCE_RESULT" = success && test "$PUBLISHED_RESULT" = success
