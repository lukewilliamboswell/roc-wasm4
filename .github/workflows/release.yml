name: Release
on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'New SemVer; publication requires main and authored docs/releases/VERSION.md'
        type: string
        default: ''
      nightly_validation:
        description: 'Build and test only; never publish'
        type: boolean
        default: true
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || inputs.nightly_validation }}
jobs:
  build_and_bundle:
    name: build-and-bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      bundle_name: ${{ steps.bundle.outputs.bundle_name }}
      nightly: ${{ steps.nightly.outputs.tag }}
      release_sha: ${{ steps.policy.outputs.sha }}
      prerelease: ${{ steps.policy.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@8afe656ea7de5586233683088eb6972b770f6832
      - name: Resolve the compiler once for this candidate
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"
      - uses: roc-lang/setup-roc@dd81390553b0a1236aedb61cdd4c0ed7cf7eaec4
        with:
          version: nightly
          nightly-tag: ${{ steps.nightly.outputs.tag }}
      - name: Admit a publication candidate
        if: github.event_name == 'workflow_dispatch' && !inputs.nightly_validation
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_tag }}
        run: blueprint run release -- validate "$RELEASE_VERSION"
      - run: blueprint run build-host
      - name: Prepare candidate bundle and notes
        id: bundle
        env:
          RELEASE_VERSION: ${{ inputs.release_tag || '0.0.0-ci' }}
        run: blueprint run release -- prepare "$RELEASE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-bundle
          path: dist/
          if-no-files-found: error
  test_bundle:
    name: test-bundle (${{ matrix.os }})
    needs: build_and_bundle
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@8afe656ea7de5586233683088eb6972b770f6832
      - uses: roc-lang/setup-roc@dd81390553b0a1236aedb61cdd4c0ed7cf7eaec4
        with:
          version: nightly
          nightly-tag: ${{ needs.build_and_bundle.outputs.nightly }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-bundle
          path: bundle
      # Python is a loopback HTTP adapter only. All cart admission and compiler
      # commands are in the same Roc task contributors run locally.
      - name: Serve exact bundle
        id: server
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory bundle > bundle-server.log 2>&1 &
          echo "pid=$!" >> "$GITHUB_OUTPUT"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat bundle-server.log
          exit 1
      - name: Check and build carts against exact bundle with an empty cache
        shell: bash
        env:
          BUNDLE_URL: http://127.0.0.1:8000/${{ needs.build_and_bundle.outputs.bundle_name }}
        run: blueprint run examples -- --bundle-url "$BUNDLE_URL"
      - name: Stop server
        if: always()
        shell: bash
        env:
          SERVER_PID: ${{ steps.server.outputs.pid }}
        run: if [ -n "$SERVER_PID" ]; then kill "$SERVER_PID" || true; fi
  create_release:
    name: create-release
    if: github.event_name == 'workflow_dispatch' && !inputs.nightly_validation
    needs: [build_and_bundle, test_bundle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # This job handles inert files and pinned publisher code, never repo tasks.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-bundle
          path: dist
      - uses: lukewilliamboswell/roc-automation/actions/publish-release@8afe656ea7de5586233683088eb6972b770f6832
        with:
          version: ${{ inputs.release_tag }}
          prerelease: ${{ needs.build_and_bundle.outputs.prerelease }}
          target: ${{ needs.build_and_bundle.outputs.release_sha }}
          notes-file: dist/release-notes.md
          assets: dist/*.tar.zst
