name: Release
'on':
  pull_request: null
  workflow_dispatch:
    inputs:
      version:
        description: Publish a new SemVer from main; empty builds and tests a dry run
        type: string
        default: ''
      nightly-tag:
        description: Exact nightly for a diagnostic run; empty selects the latest once
        type: string
        default: ''
permissions: {}
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version != '' && 'publish' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.version == '' }}
jobs:
  validate:
    name: Admit release request
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.request.outputs.version }}
      prerelease: ${{ steps.request.outputs.prerelease }}
      sha: ${{ steps.request.outputs.sha }}
      nightly: ${{ steps.nightly.outputs.tag }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@8afe656ea7de5586233683088eb6972b770f6832
      with:
        cache: true
        cache-workload: release-control
    - id: request
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
      run: blueprint run release-request
    - id: nightly
      env:
        GH_TOKEN: ${{ github.token }}
        REQUESTED: ${{ inputs.nightly-tag || '' }}
      run: |-
        tag="$REQUESTED"
        if [ -z "$tag" ]; then tag="$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)"; fi
        [[ "$tag" =~ ^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{7,40}$ ]]
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
  host:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/host.yml
  build:
    name: Build release assets
    needs:
    - validate
    - host
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      bundle_name: ${{ steps.package.outputs.bundle_name }}
      assets: ${{ steps.sbom.outputs.assets }}
      subjects: ${{ steps.sbom.outputs.subjects }}
      producing_attempt: ${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@8afe656ea7de5586233683088eb6972b770f6832
      with:
        cache: true
        cache-workload: release-build
    - uses: roc-lang/setup-roc@dd81390553b0a1236aedb61cdd4c0ed7cf7eaec4
      with:
        version: nightly
        nightly-tag: ${{ needs.validate.outputs.nightly }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: wasm32-host
        path: platform/targets/wasm32
    - run: blueprint run check-source
    - run: blueprint run glue
      env:
        GH_TOKEN: ${{ github.token }}
    - id: package
      env:
        VERSION: ${{ needs.validate.outputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: blueprint run release -- prepare "$VERSION"
    - run: blueprint run sbom-suppliers
    - run: git diff --exit-code -- sbom/imports.json
    - id: sbom
      env:
        VERSION: ${{ needs.validate.outputs.version }}
      run: blueprint run sbom-sidecars -- "$VERSION"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: release-candidate
        path: dist/
        if-no-files-found: error
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
      with:
        path: .docs-out/site
  test_archive:
    name: Run immutable archived carts in WASM-4
    needs:
    - validate
    - build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@8afe656ea7de5586233683088eb6972b770f6832
      with:
        cache: true
        cache-workload: release-test
    - uses: roc-lang/setup-roc@dd81390553b0a1236aedb61cdd4c0ed7cf7eaec4
      with:
        version: nightly
        nightly-tag: ${{ needs.validate.outputs.nightly }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: release-candidate
        path: dist
    - run: blueprint run release-test -- test-archive
  cross_build:
    name: Compiler host (${{ matrix.os }})
    needs:
    - validate
    - build
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - ubuntu-24.04-arm
        - macos-15
        - macos-15-intel
        - windows-2022
        - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@8afe656ea7de5586233683088eb6972b770f6832
      with:
        cache: true
        cache-workload: compiler-host-${{ runner.os }}-${{ runner.arch }}
    - uses: roc-lang/setup-roc@dd81390553b0a1236aedb61cdd4c0ed7cf7eaec4
      with:
        version: nightly
        nightly-tag: ${{ needs.validate.outputs.nightly }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: release-candidate
        path: dist
    - run: blueprint run cross-build
  verify:
    name: Verify release evidence
    needs:
    - validate
    - build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: lukewilliamboswell/roc-automation
        ref: 8afe656ea7de5586233683088eb6972b770f6832
        path: .roc-automation
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: release-candidate
        path: dist
    - name: Independently verify transferred subjects and SBOMs
      env:
        INPUT_SUBJECTS: ${{ needs.build.outputs.subjects }}
        INPUT_ASSETS: ${{ needs.build.outputs.assets }}
        INPUT_PRODUCING_ATTEMPT: ${{ needs.build.outputs.producing_attempt }}
        INPUT_VERSION: ${{ needs.validate.outputs.version }}
      run: python3 .roc-automation/actions/sbom-sidecars/verify_transferred.py
    - name: Verify each published inventory against the bound digest
      run: |-
        python3 - <<'PYVERIFY'
        import hashlib, json
        from pathlib import Path
        record = json.loads(Path('dist/sbom-evidence.json').read_text())
        for subject in record['subjects']:
            path = Path(subject['path'] + '.inventory.json')
            assert hashlib.sha256(path.read_bytes()).hexdigest() == subject['inventory_sha256'], path
        print('Every retained inventory matches its subject binding')
        PYVERIFY
  required:
    name: build-and-bundle
    if: always()
    needs:
    - validate
    - host
    - build
    - test_archive
    - cross_build
    - verify
    runs-on: ubuntu-24.04
    steps:
    - env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: for result in $RESULTS; do test "$result" = success || exit 1; done
  publish:
    name: Publish tested release
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    needs:
    - validate
    - build
    - required
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    environment: release
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: lukewilliamboswell/roc-automation
        ref: 8afe656ea7de5586233683088eb6972b770f6832
        path: .roc-automation
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: release-candidate
        path: dist
    - name: Independently verify transferred subjects and SBOMs
      env:
        INPUT_SUBJECTS: ${{ needs.build.outputs.subjects }}
        INPUT_ASSETS: ${{ needs.build.outputs.assets }}
        INPUT_PRODUCING_ATTEMPT: ${{ needs.build.outputs.producing_attempt }}
        INPUT_VERSION: ${{ needs.validate.outputs.version }}
      run: python3 .roc-automation/actions/sbom-sidecars/verify_transferred.py
    - name: Verify each published inventory against the bound digest
      run: |-
        python3 - <<'PYVERIFY'
        import hashlib, json
        from pathlib import Path
        record = json.loads(Path('dist/sbom-evidence.json').read_text())
        for subject in record['subjects']:
            path = Path(subject['path'] + '.inventory.json')
            assert hashlib.sha256(path.read_bytes()).hexdigest() == subject['inventory_sha256'], path
        print('Every retained inventory matches its subject binding')
        PYVERIFY
    - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
      with:
        subject-path: ${{ needs.build.outputs.assets }}
    - uses: lukewilliamboswell/roc-automation/actions/publish-release@8afe656ea7de5586233683088eb6972b770f6832
      with:
        version: ${{ needs.validate.outputs.version }}
        prerelease: ${{ needs.validate.outputs.prerelease }}
        target: ${{ needs.validate.outputs.sha }}
        notes-file: dist/release-notes.md
        assets: ${{ needs.build.outputs.assets }}
  deploy_docs:
    name: Deploy released documentation
    if: needs.publish.result == 'success' && needs.validate.outputs.prerelease == 'false'
    needs:
    - validate
    - publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
