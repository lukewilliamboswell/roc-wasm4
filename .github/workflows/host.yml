name: Cached wasm32 host
on:
  workflow_call:
permissions: {}
jobs:
  host:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@8afe656ea7de5586233683088eb6972b770f6832
      - id: inputs
        run: blueprint run host-fingerprint
      - id: host
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: platform/targets/wasm32/host.wasm
          key: wasm32-host-v1-${{ steps.inputs.outputs.fingerprint }}
      - if: steps.host.outputs.cache-hit != 'true'
        run: blueprint run build-host
      - if: steps.host.outputs.cache-hit != 'true'
        run: blueprint run host-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wasm32-host
          path: platform/targets/wasm32/host.wasm
          if-no-files-found: error
