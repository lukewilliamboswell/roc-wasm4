name: Generate docs

on:
  # Run when a release is published
  release:
    types:
      - published

jobs:
  generate-docs:
    name: Generate docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Read compiler pin for installation
        id: pinned_roc
        shell: bash
        run: |
          nightly_tag="$(sed -n 's/^[[:space:]]*packages { roc: "\([^"]*\)" }$/\1/p' platform/main.roc)"
          [[ "$nightly_tag" =~ ^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{7,40}$ ]]
          echo "nightly_tag=$nightly_tag" >> "$GITHUB_OUTPUT"
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install Roc
        uses: roc-lang/setup-roc@main
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.pinned_roc.outputs.nightly_tag }}
      - name: Build host object
        run: zig build
      - name: Generate docs
        run: roc docs platform/main.roc
      - name: Fix absolute paths
        run: |
          find generated-docs/ -type f -name '*.html' -exec sed -i "s/\(href\|src\)=\"\//\1=\"\/${{ github.event.repository.name }}\//g" {} +
      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: generated-docs
      - name: Deploy docs
        uses: actions/deploy-pages@v5
